<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Principal</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Control de Envíos</h1>
        <nav>
            <button class="nav-tab active">Envíos</button>
            <button class="nav-tab" id="tab-flotas">Gestión de Flotas</button>
            <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
        </nav>
    </header>

    <main>
        <section id="seccion-formulario" class="card">
            <h2>Registrar Nuevo Envío</h2>
            <form id="envio-form">
                <input type="text" id="codigoRastreo" placeholder="Código de Rastreo" required>
                <input type="text" id="direccionDestino" placeholder="Dirección Destino" required>
                <input type="number" step="0.01" id="pesoKg" placeholder="Peso" required>
                <input type="number" step="0.01" id="costo" placeholder="Costo" required>
                <input type="number" id="vehiculoId" placeholder="ID Vehículo" required>
                <input type="number" id="conductorId" placeholder="ID Conductor" required>
                <button type="submit" class="btn btn-primary">Crear Envío</button>
            </form>
        </section>

        <section>
            <div class="filters">
                <button class="btn-filter active" data-filter="TODOS">Todos</button>
                <button class="btn-filter" data-filter="PENDIENTE">Pendientes</button>
                <button class="btn-filter" data-filter="EN_TRANSITO">En Tránsito</button>
                <button class="btn-filter" data-filter="ENTREGADO">Entregados</button>
            </div>

            <div id="grid-envios" class="grid-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>

    <div id="modal-bitacora" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Historial de Auditoría</h3>
                <button type="button" class="btn-close" onclick="cerrarModalBitacora()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="filter-dates-container">
                    <div class="date-input-group">
                        <label for="fechaInicio">Desde:</label>
                        <input type="date" id="fechaInicio" onchange="filtrarBitacoraPorFechas()">
                    </div>
                    <div class="date-input-group">
                        <label for="fechaFin">Hasta:</label>
                        <input type="date" id="fechaFin" onchange="filtrarBitacoraPorFechas()">
                    </div>
                    <button type="button" class="btn-sm btn-secondary" onclick="limpiarFiltroFechas()">Limpiar</button>
                </div>

                <table class="tabla-bitacora">
                    <thead>
                        <tr>
                            <th>Transición (Estado)</th>
                            <th>Fecha y Hora</th>
                            <th>Usuario</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="contenido-bitacora">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
