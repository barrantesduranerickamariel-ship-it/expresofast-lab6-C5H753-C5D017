<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast - Plataforma de Monitoreo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">ExpresoFast</div>
        <nav>
            <span>Panel de Monitoreo de Envíos</span>
        </nav>
    </header>

    <main class="container">
        <aside class="sidebar">
            <section class="card">
                <h2>Registrar Nuevo Envío</h2>
                <form id="envio-form">
                    <div class="form-group">
                        <label for="codigoRastreo">Código de Rastreo:</label>
                        <input type="text" id="codigoRastreo" required placeholder="EXP-1001">
                    </div>
                    <div class="form-group">
                        <label for="direccionDestino">Dirección Destino:</label>
                        <input type="text" id="direccionDestino" required placeholder="Paraíso, Cartago">
                    </div>
                    <div class="form-group">
                        <label for="pesoKg">Peso (kg):</label>
                        <input type="number" id="pesoKg" step="0.01" required placeholder="15.5">
                    </div>
                    <div class="form-group">
                        <label for="costo">Costo (₡):</label>
                        <input type="number" id="costo" step="0.01" required placeholder="5000">
                    </div>
                    <div class="form-group">
                        <label for="vehiculoId">ID Vehículo:</label>
                        <input type="number" id="vehiculoId" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="conductorId">ID Conductor:</label>
                        <input type="number" id="conductorId" value="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar Envío</button>
                </form>
            </section>

            <section class="card filter-section">
                <h3>Filtrar por Estado</h3>
                <div class="filter-buttons">
                    <button class="btn-filter active" data-filter="TODOS">TODOS</button>
                    <button class="btn-filter" data-filter="PENDIENTE">PENDIENTE</button>
                    <button class="btn-filter" data-filter="EN_TRANSITO">EN TRANSITO</button>
                    <button class="btn-filter" data-filter="ENTREGADO">ENTREGADO</button>
                </div>
            </section>
        </aside>

        <section class="dashboard">
            <h2>Tablero de Envíos</h2>
            <div id="grid-envios" class="grid-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
